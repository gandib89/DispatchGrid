name: dispatchgrid

services:
  postgres:
    image: postgres:16-alpine
    container_name: dispatchgrid-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: dispatchgrid
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./server/prisma/docker/init.sql:/docker-entrypoint-initdb.d/01-dispatchgrid.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dispatchgrid"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: dispatchgrid-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  redis_data:
